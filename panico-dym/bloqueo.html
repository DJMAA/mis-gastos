<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pánico DYM</title>
  <link rel="stylesheet" href="bloqueo.css">
</head>
<body>
  <main>
    <h1>🛑 No lo hagas.<br>No dejes que el enemigo te domine.</h1>
    <p class="sub">Respira. Este momento pasa. Tú eres más fuerte en Cristo.</p>
    <blockquote><span id="texto"></span><cite id="cita"></cite></blockquote>
    <div class="botones">
      <button id="salir" class="principal">Salir de aquí</button>
      <button id="orar">Orar un minuto</button>
      <button id="otro">Otro versículo</button>
    </div>
    <section id="oracion" hidden>
      <div id="cuenta">60</div>
      <p>Señor, en este momento te entrego mi mente y mis ojos. Dame fuerzas para resistir
        y llena mi corazón de tu paz. Gracias porque tu gracia me basta. En el nombre de Jesús, amén.</p>
    </section>
  </main>
  <script type="module" src="bloqueo.js"></script>
</body>
</html>
